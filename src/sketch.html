  <!-- sketch: shared by student.html and dashboard.html. Drawings as data, as SVG, and the
       enlarged view. A drawing is pen strokes on a 600 x 400 canvas in whole units:
         { v: 1, bg: 'axes', s: [[colour, x0, y0, dx1, dy1, ...], ...] }
       (each later point is a step from the one before). A drawing on a figure has
       bg: 'image' and, added by the server, fig: an uploaded figure's ID or img: a linked
       figure's address. Uploaded figures are fetched with apiGetFigure and kept here. Src/Responses.gs checks the same
       format and limits. -->
  <style>
    .sketchSvg { display:block; width:100%; height:auto; background:#fff; border:1px solid #d0d5dd; border-radius:6px; }
    .sketchBlock { margin-top:6px; cursor:zoom-in; max-width:480px; }
    .sketchModal { position:fixed; inset:0; background:rgba(15,23,42,0.75); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
    .sketchModalBox { position:relative; background:#fff; border-radius:10px; padding:14px; width:min(1100px, 100%); max-height:100%; overflow:auto; }
    .sketchModalBox .sketchSvg { border:none; }
    .sketchModalClose { position:absolute; top:8px; right:8px; border:1px solid #d0d5dd; background:#fff; border-radius:50%; width:36px; height:36px; font-size:18px; cursor:pointer; z-index:1; }
  </style>
  <script>
    const SKETCH_W = 600, SKETCH_H = 400;
    const SKETCH_COLOURS = ['#111827', '#1d4ed8', '#dc2626'];   // black, blue, red
    const SKETCH_COLOUR_NAMES = ['Black', 'Blue', 'Red'];
    const SKETCH_STROKE_W = 3;
    const SKETCH_BACKGROUNDS = ['blank', 'grid', 'axes', 'image'];

    /** A figure address made ready to show, as the server does it (normalizeImageUrl_ in
     *  src/Sessions.gs): a Google Drive share link becomes a direct image link; anything else
     *  must be a plain https:// address. '' if it can't be used. */
    function sketchImageUrl(raw){
      const url = String(raw == null ? '' : raw).trim();
      if (!url || url.length > 2000) return '';
      const drive = /^https:\/\/drive\.google\.com\/(?:file\/d\/([\w-]+)|(?:open|uc)\?(?:[^#]*&)?id=([\w-]+))/.exec(url);
      if (drive) return 'https://drive.google.com/thumbnail?id=' + (drive[1] || drive[2]) + '&sz=w1600';
      return /^https:\/\/[^\s"'<>\\`]+$/i.test(url) ? url : '';
    }
    // --- Uploaded figures: fetched once per page, then reused ---
    const SKETCH_FIGURES = Object.create(null);   // id -> { data: 'data:image/...' | '', failed, waiters: [fn] }
    const SKETCH_FIGURE_ID_RE = /^[\w-]{10,200}$/;
    const SKETCH_DATA_URL_RE = /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+\/]+={0,2}$/;
    /** Call done(ok) once figure id has loaded (or failed). Fetches it if needed. Images
     *  already drawn with sketchBackgroundSVG get it filled in automatically. */
    function loadSketchFigure(id, done){
      if (!SKETCH_FIGURE_ID_RE.test(String(id || ''))) { if (done) done(false); return; }
      let f = SKETCH_FIGURES[id];
      if (f && (f.data || f.failed)) { if (done) done(!!f.data); return; }
      if (f) { if (done) f.waiters.push(done); return; }
      f = SKETCH_FIGURES[id] = { data: '', failed: false, waiters: done ? [done] : [] };
      const finish = (data) => {
        if (data && SKETCH_DATA_URL_RE.test(data)) {
          f.data = data;
          document.querySelectorAll('image[data-fig="' + id + '"]').forEach(el => el.setAttribute('href', data));
        } else f.failed = true;
        const ws = f.waiters; f.waiters = [];
        ws.forEach(fn => fn(!!f.data));
      };
      google.script.run
        .withSuccessHandler(res => finish(res && res.ok ? res.data : ''))
        .withFailureHandler(() => finish(''))
        .apiGetFigure(id);
    }
    /** Let an uploaded figure be shown at once, without fetching it (e.g. just uploaded) */
    function rememberSketchFigure(id, data){
      if (SKETCH_FIGURE_ID_RE.test(String(id || '')) && SKETCH_DATA_URL_RE.test(String(data || ''))) {
        SKETCH_FIGURES[id] = { data, failed: false, waiters: [] };
      }
    }

    /** An image address made safe for an HTML/SVG attribute (or '' if it isn't https) */
    function sketchImageAttr(url){
      const u = /^https:\/\/[^\s"'<>\\`]+$/i.test(String(url || '')) ? String(url) : '';
      return u.replace(/&/g, '&amp;');
    }
    const SKETCH_MAX_CHARS = 30000;   // must match src/Responses.gs

    /** A stored stroke [c, x0, y0, dx1, dy1, ...] as { c, pts: [[x, y], ...] } */
    function decodeStroke(a){
      const n = (Array.isArray(a) ? a : []).map(v => Number(v) || 0);
      let x = n[1] || 0, y = n[2] || 0;
      const pts = [[x, y]];
      for (let i = 3; i + 1 < n.length; i += 2) { x += n[i]; y += n[i + 1]; pts.push([x, y]); }
      return { c: n[0] | 0, pts };
    }
    /** { c, pts } (whole-number points) as [c, x0, y0, dx1, dy1, ...] */
    function encodeStroke(st){
      const out = [st.c, st.pts[0][0], st.pts[0][1]];
      for (let i = 1; i < st.pts.length; i++) out.push(st.pts[i][0] - st.pts[i - 1][0], st.pts[i][1] - st.pts[i - 1][1]);
      return out;
    }
    /** Fewer points along nearly straight runs (Ramer–Douglas–Peucker), keeping the shape */
    function simplifyPoints(pts, eps){
      if (pts.length < 3) return pts.slice();
      const keep = new Array(pts.length).fill(false);
      keep[0] = keep[pts.length - 1] = true;
      const stack = [[0, pts.length - 1]];
      while (stack.length) {
        const [a, b] = stack.pop();
        const [ax, ay] = pts[a], [bx, by] = pts[b];
        const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
        let best = -1, far = eps;
        for (let i = a + 1; i < b; i++) {
          const [px, py] = pts[i];
          const d = len ? Math.abs(dy * px - dx * py + bx * ay - by * ax) / len : Math.hypot(px - ax, py - ay);
          if (d > far) { far = d; best = i; }
        }
        if (best >= 0) { keep[best] = true; stack.push([a, best], [best, b]); }
      }
      return pts.filter((_, i) => keep[i]);
    }
    /** Raw pointer points to a stored-ready stroke: clamped, whole units, simplified */
    function finishStroke(c, rawPts){
      const clamp = (v, max) => Math.max(0, Math.min(max, Math.round(v)));
      const pts = [];
      rawPts.forEach(([x, y]) => {
        const p = [clamp(x, SKETCH_W), clamp(y, SKETCH_H)];
        const last = pts[pts.length - 1];
        if (!last || last[0] !== p[0] || last[1] !== p[1]) pts.push(p);
      });
      return { c, pts: simplifyPoints(pts, 1) };
    }

    const r1_ = v => Math.round(v * 10) / 10;
    /** SVG path data for a stroke, smoothed through the midpoints between points */
    function strokePathD(pts){
      if (!pts.length) return '';
      const [x0, y0] = pts[0];
      if (pts.length === 1) return `M${x0} ${y0}l0.01 0`;   // a dot
      if (pts.length === 2) return `M${x0} ${y0}L${pts[1][0]} ${pts[1][1]}`;
      let d = `M${x0} ${y0}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const [x, y] = pts[i], [nx, ny] = pts[i + 1];
        d += `Q${x} ${y} ${r1_((x + nx) / 2)} ${r1_((y + ny) / 2)}`;
      }
      const [lx, ly] = pts[pts.length - 1];
      return d + `L${lx} ${ly}`;
    }
    function strokeSVG(st){
      const colour = SKETCH_COLOURS[st.c] || SKETCH_COLOURS[0];
      return `<path d="${strokePathD(st.pts)}" stroke="${colour}" stroke-width="${SKETCH_STROKE_W}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    /** The background as SVG markup (numbers, fixed strings, a checked https address or a
     *  checked image data URL). For bg 'image', fig is an uploaded figure's ID (fetched if
     *  needed, and filled in when it arrives) or img a linked figure's address. The figure is
     *  fitted inside the canvas. */
    function sketchBackgroundSVG(bg, img, fig){
      let out = `<rect x="0" y="0" width="${SKETCH_W}" height="${SKETCH_H}" fill="#fff"/>`;
      const fit = `x="0" y="0" width="${SKETCH_W}" height="${SKETCH_H}" preserveAspectRatio="xMidYMid meet"`;
      const figId = bg === 'image' && SKETCH_FIGURE_ID_RE.test(String(fig || '')) ? String(fig) : '';
      const href = bg === 'image' && !figId ? sketchImageAttr(img) : '';
      if (figId) {
        const f = SKETCH_FIGURES[figId];
        if (!f) loadSketchFigure(figId);
        out += `<image data-fig="${figId}" href="${f && f.data ? f.data : ''}" ${fit}/>`;
      } else if (href) {
        out += `<image href="${href}" ${fit}/>`;
      } else if (bg === 'grid') {
        let d = '';
        for (let x = 25; x < SKETCH_W; x += 25) d += `M${x} 0V${SKETCH_H}`;
        for (let y = 25; y < SKETCH_H; y += 25) d += `M0 ${y}H${SKETCH_W}`;
        out += `<path d="${d}" stroke="#e5e7eb" stroke-width="1" fill="none"/>`;
      } else if (bg === 'axes') {
        // First-quadrant axes with light ticks: for sketching distributions, scatterplots, curves
        const ox = 50, oy = 360;
        let ticks = '';
        for (let x = ox + 50; x <= SKETCH_W - 40; x += 50) ticks += `M${x} ${oy}v6`;
        for (let y = oy - 50; y >= 40; y -= 50) ticks += `M${ox} ${y}h-6`;
        out += `<path d="${ticks}" stroke="#9ca3af" stroke-width="1.5" fill="none"/>`
             + `<path d="M${ox} ${oy}H${SKETCH_W - 20}M${ox} ${oy}V20" stroke="#4b5563" stroke-width="2" fill="none"/>`
             + `<path d="M${SKETCH_W - 20} ${oy}l-10 -5v10zM${ox} 20l-5 10h10z" fill="#4b5563"/>`;
      }
      return out;
    }
    /** A drawing as an <svg> string. Built from numbers, fixed colours and a checked figure
     *  address only, so it's safe to insert with innerHTML. */
    function sketchSVG(sketch, cls){
      const bg = SKETCH_BACKGROUNDS.indexOf(sketch && sketch.bg) >= 0 ? sketch.bg : 'blank';
      const strokes = (sketch && Array.isArray(sketch.s)) ? sketch.s : [];
      return `<svg class="${cls || 'sketchSvg'}" viewBox="0 0 ${SKETCH_W} ${SKETCH_H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drawing">`
        + sketchBackgroundSVG(bg, sketch && sketch.img, sketch && sketch.fig) + strokes.map(a => strokeSVG(decodeStroke(a))).join('') + '</svg>';
    }
    function hasSketch(sketch){ return !!(sketch && Array.isArray(sketch.s) && sketch.s.length); }

    // --- Enlarged view: click a drawing to see it full size (e.g. on the projector) ---
    const SKETCH_VIEWS = Object.create(null);   // { key: { sketch, math } }
    /** A clickable drawing, or '' if there isn't one. key names it for the enlarged view;
     *  math (optional) is shown under it there. */
    function sketchBlockHTML(sketch, key, math){
      if (!hasSketch(sketch)) return '';
      const k = String(key).replace(/[^\w-]/g, '');
      SKETCH_VIEWS[k] = { sketch, math: math || [] };
      return `<div class="sketchBlock" title="Click to enlarge" onclick="event.stopPropagation(); openSketchModal('${k}')">${sketchSVG(sketch)}</div>`;
    }
    function openSketchModal(key){
      const v = SKETCH_VIEWS[key];
      if (!v) return;
      let m = document.getElementById('sketchModal');
      if (!m) {
        m = document.createElement('div');
        m.id = 'sketchModal';
        m.className = 'sketchModal';
        m.addEventListener('click', e => { if (e.target === m) closeSketchModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSketchModal(); });
        document.body.appendChild(m);
      }
      m.innerHTML = '<div class="sketchModalBox"><button type="button" class="sketchModalClose" onclick="closeSketchModal()" aria-label="Close">✕</button>'
        + sketchSVG(v.sketch) + (typeof mathBlockHTML === 'function' ? mathBlockHTML(v.math) : '') + '</div>';
      m.style.display = 'flex';
    }
    function closeSketchModal(){
      const m = document.getElementById('sketchModal');
      if (m) m.style.display = 'none';
    }
  </script>
